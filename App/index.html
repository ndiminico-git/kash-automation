/* foco visible y coherente */
:where(button,summary,select,[tabindex]):focus-visible,input[type=checkbox]:focus-visible,input[type=radio]:focus-visible{outline:2px solid var(--kFocus);outline-offset:2px}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{border-color:#39d3d0;box-shadow:0 0 0 3px var(--kFocusSoft);outline:none}
.flatMoney input:focus,.baseHoldingStepper input:focus{box-shadow:none!important}
.baseHoldingStepper:focus-within{border-color:#39d3d0!important;box-shadow:0 0 0 3px var(--kFocusSoft)!important}
/* transiciones suaves */
.btn,button,select,input,textarea,.trashbtn,.editbtn,.stateBtn,.statussel,.kpi,.holdingTileNew,.flowTile,.summarySectionCard,.panel,.monthtable td.c,details>summary{transition:background-color .16s var(--kEase),border-color .16s var(--kEase),box-shadow .16s var(--kEase),color .16s var(--kEase),filter .16s var(--kEase),opacity .16s var(--kEase)}
/* botones: jerarquía y feedback */
.btn:not(.g):not(.d){box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 3px 10px rgba(57,211,208,.14)}
.btn:not(.g):not(.d):hover:not(:disabled){filter:brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 5px 16px rgba(57,211,208,.24)}
.btn.g:hover:not(:disabled){background:rgba(255,255,255,.055);border-color:#3f5a85}
.btn.d:hover:not(:disabled){background:#82303b}
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(.96)}
.btn:disabled,button:disabled{cursor:not-allowed}
.trashbtn:hover{color:#ff8a92;background:rgba(255,111,120,.16)}
.editbtn:hover{color:#bcd9ff;background:rgba(157,198,255,.16)}
.trashbtn:active,.editbtn:active,.stateBtn:active,.zoomControls button:active{transform:scale(.93)}
.stateBtn:hover,.zoomControls button:hover{border-color:#3f5a85}
/* navegación: indicador de página activa */
#nav button{transition:background-color .15s var(--kEase),box-shadow .15s var(--kEase)}
#nav .navPrimary button.on,#nav .navbottom>button.on{box-shadow:inset 3px 0 0 #39d3d0,inset 0 0 0 1px rgba(255,255,255,.04);background:linear-gradient(90deg,rgba(57,211,208,.13),#172337 70%)}
#nav .navPrimary button:not(.on):hover,#nav .navbottom>button:not(.on):hover{background:rgba(255,255,255,.06)}
/* tarjetas y paneles: profundidad sutil */
.panel,.summarySectionCard,.summarySidePanel,.quickConverter{box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 22px rgba(0,0,0,.16)}
.panel .panel{box-shadow:none}
.holdingTileNew:hover,.flowTile:hover,.kpi:hover{filter:brightness(1.07)}
/* tablas: fila resaltada al pasar el mouse (sin pisar los colores de estado) */
.monthtable tr:not(.g):not(.sg):not(.summaryGap):hover>td,.expenseTable tbody tr:hover>td,.fxTable tbody tr:hover>td,.tenAdjTable tbody tr:hover>td,.recAdmin tbody tr:hover>td,.rubroadm tbody tr:hover>td{background-image:linear-gradient(rgba(255,255,255,.04),rgba(255,255,255,.04))}
/* cifras alineadas */
td,th,.val,.valw,.kpi b,.approxValue,.holdingText strong,.flowText strong,.rankValue,.rankPct,.chartAxisText,.donutLegendRow{font-variant-numeric:tabular-nums}
/* desplegables de ajustes */
details>summary:hover{background:rgba(255,255,255,.03)}
/* modales y menús: entrada suave */
@keyframes kFade{from{opacity:0}to{opacity:1}}
@keyframes kPop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.darkModal{animation:kFade .16s ease-out;backdrop-filter:blur(3px)}
.darkModalBox{animation:kPop .18s var(--kEase)}
.ctxmenu,.serviceCtxMenu{animation:kFade .12s ease-out}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

   lines=row(KashI18n.text('Total de entradas'),income,'+')+row(KashI18n.text('Total de salidas'),expense,'−')+`<div class="flowTipFormula">${esc(money(income))} − ${esc(money(expense))}</div>`;
 }

function historySnapshot(){try{return D?JSON.stringify(D):null}catch{return null}}
function resetHistory(){const snap=historySnapshot();undoStack=snap?[snap]:[];redoStack=[]}
function rememberState(){if(!D)return;const snap=historySnapshot();if(!snap)return;if(undoStack[undoStack.length-1]!==snap){undoStack.push(snap);if(undoStack.length>120)undoStack.shift()}redoStack=[]}
function canUndo(){return undoStack.length>1}
function canRedo(){return redoStack.length>0}
function restoreSnapshot(snap){if(!snap)return;D=migrate(JSON.parse(snap));S.tenAdjEdit=null;S.cuEdit=null;S.expenseEdit=null;S.fxEdit=null;render();sendNow();}
function undoChange(){if(!canUndo())return;const current=historySnapshot();if(current)redoStack.push(current);undoStack.pop();restoreSnapshot(undoStack[undoStack.length-1]);S.dirty=true;msg(KashI18n.text('Deshacer'))}
function redoChange(){if(!canRedo())return;const snap=redoStack.pop();const current=historySnapshot();if(current&&undoStack[undoStack.length-1]!==current)undoStack.push(current);if(snap&&undoStack[undoStack.length-1]!==snap)undoStack.push(snap);restoreSnapshot(snap);S.dirty=true;msg(KashI18n.text('Rehacer'))}
// Cada periodo finaliza en el mes seleccionado, igual que las columnas de Consumos Mensuales.
const SUMMARY_PERIODS=KashI18n.live(()=>(MN.map((name,i)=>{const end=i+1;return [String(end).padStart(2,'0'),`${MN[(i+11)%12]} / ${name}`]})));
function normalizeSummaryPeriod(m){
 const value=String(m||today);
 const match=value.match(/^(\d{4})-(\d{2})$/);
 if(!match)return today;
 const month=Number(match[2]);
 return month>=1&&month<=12?value:today;
}

function syncSummarySideColumn(){

 if(!dash||!main||!side)return;

function serviceRepeatDate(kind){const get=s=>document.getElementById('sd_'+kind+'_'+s),m=document.getElementById('sd_month')?.value,day=Number(get('day')?.value),offset=serviceNormalizeOffset(get('offset')?.value);if(!get('on')?.checked||!get('repeat')?.checked||!serviceValidMonth(m)||!Number.isInteger(day)||day<1||day>31)return;get('date').value=serviceDayDate(add(m,offset),day);updateServiceDatesStatus()}

 for(const m of [add(month,-1),month,add(month,1)])periods.add(m);

function serviceToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function serviceValidMonth(m){return /^\d{4}-(0[1-9]|1[0-2])$/.test(String(m||''))}
function serviceValidDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||'')))return false;const d=new Date(s+'T12:00:00Z');return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===s}
function serviceDayDate(m,day){if(!serviceValidMonth(m))return '';const max=new Date(+m.slice(0,4),+m.slice(5),0).getDate();return m+'-'+String(Math.min(max,Math.max(1,+day||1))).padStart(2,'0')}

 for(const [id,c] of Object.entries(x.serviceDates)){if(!c||typeof c!=='object')continue;c.rules=Array.isArray(c.rules)?c.rules.filter(r=>r&&serviceValidMonth(r.from)).map(r=>({...r,lead:Math.min(30,Math.max(0,Math.round(+r.lead||0))),close:serviceNormalizeKind(r.close),due:serviceNormalizeKind(r.due)})).sort((a,b)=>a.from.localeCompare(b.from)):[];c.months=c.months&&typeof c.months==='object'&&!Array.isArray(c.months)?c.months:{}}

 if(!D||!serviceValidDate(now))return false;let changed=false;const records=D.serviceNotifications||(D.serviceNotifications=[]),month=now.slice(0,7);
 const services=new Map((D.rub||[]).map(r=>[String(r.id),r]));
 for(const n of records){const r=services.get(String(n.serviceId)),expected=r&&serviceEligible(r,n.month)?serviceEventDate(r.id,n.month,n.kind):'',status=expected===n.date?'active':'cancelled';if(n.status!==status){n.status=status;changed=true}}

 const keys=new Set(records.map(serviceNotificationKey));

  if(!serviceEligible(r,m))continue;const rule=serviceRule(r.id,m);
  for(const kind of ['close','due']){const date=serviceEventDate(r.id,m,kind);if(!date)continue;const days=serviceDelta(date,now),record={serviceId:r.id,kind,date,month:m},key=serviceNotificationKey(record);if(days < -7||days>rule.lead||keys.has(key))continue;

  }
 }}

}

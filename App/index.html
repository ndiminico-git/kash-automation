:where(button,summary,select,[tabindex]):focus-visible,input[type=checkbox]:focus-visible,input[type=radio]:focus-visible{outline:2px solid var(--kFocus);outline-offset:2px}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{border-color:#39d3d0;box-shadow:0 0 0 3px var(--kFocusSoft);outline:none}

.baseHoldingStepper:focus-within{border-color:#39d3d0!important;box-shadow:0 0 0 3px var(--kFocusSoft)!important}
/* transiciones suaves */
.btn,button,select,input,textarea,.trashbtn,.editbtn,.stateBtn,.statussel,.kpi,.holdingTileNew,.flowTile,.summarySectionCard,.panel,.monthtable td.c,details>summary{transition:background-color .16s var(--kEase),border-color .16s var(--kEase),box-shadow .16s var(--kEase),color .16s var(--kEase),filter .16s var(--kEase),opacity .16s var(--kEase)}
/* botones: jerarquía y feedback */

.btn:not(.g):not(.d):hover:not(:disabled){filter:brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 5px 16px rgba(57,211,208,.24)}
.btn.g:hover:not(:disabled){background:rgba(255,255,255,.055);border-color:#3f5a85}
.btn.d:hover:not(:disabled){background:#82303b}
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(.96)}
.btn:disabled,button:disabled{cursor:not-allowed}
.trashbtn:hover{color:#ff8a92;background:rgba(255,111,120,.16)}
.editbtn:hover{color:#bcd9ff;background:rgba(157,198,255,.16)}
.trashbtn:active,.editbtn:active,.stateBtn:active,.zoomControls button:active{transform:scale(.93)}
.stateBtn:hover,.zoomControls button:hover{border-color:#3f5a85}
/* navegación: indicador de página activa */
#nav button{transition:background-color .15s var(--kEase),box-shadow .15s var(--kEase)}
#nav .navPrimary button.on,#nav .navbottom>button.on{box-shadow:inset 3px 0 0 #39d3d0,inset 0 0 0 1px rgba(255,255,255,.04);background:linear-gradient(90deg,rgba(57,211,208,.13),#172337 70%)}

/* tarjetas y paneles: profundidad sutil */
.panel,.summarySectionCard,.summarySidePanel,.quickConverter{box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 22px rgba(0,0,0,.16)}
.panel .panel{box-shadow:none}
.holdingTileNew:hover,.flowTile:hover,.kpi:hover{filter:brightness(1.07)}
/* tablas: fila resaltada al pasar el mouse (sin pisar los colores de estado) */
.monthtable tr:not(.g):not(.sg):not(.summaryGap):hover>td,.expenseTable tbody tr:hover>td,.fxTable tbody tr:hover>td,.tenAdjTable tbody tr:hover>td,.recAdmin tbody tr:hover>td,.rubroadm tbody tr:hover>td{background-image:linear-gradient(rgba(255,255,255,.04),rgba(255,255,255,.04))}
/* cifras alineadas */
td,th,.val,.valw,.kpi b,.approxValue,.holdingText strong,.flowText strong,.rankValue,.rankPct,.chartAxisText,.donutLegendRow{font-variant-numeric:tabular-nums}
/* desplegables de ajustes */
details>summary:hover{background:rgba(255,255,255,.03)}
/* modales y menús: entrada suave */
@keyframes kFade{from{opacity:0}to{opacity:1}}
@keyframes kPop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.darkModal{animation:kFade .16s ease-out;backdrop-filter:blur(3px)}

function mergeRubro(sourceId,targetId){if(D.serviceDates?.[sourceId]&&D.serviceDates?.[targetId]){darkAlert(KashI18n.text('Ambos servicios tienen cierres o vencimientos configurados. Se conservan separados para evitar perder sus fechas.'),KashI18n.text('Fechas al unificar'));return}const src=D.rub.find(r=>r.id==sourceId),dst=D.rub.find(r=>r.id==targetId);if(!src||!dst||src.id===dst.id)return;if(src.t!==dst.t||src.m!==dst.m){darkAlert(KashI18n.text('Los rubros deben tener el mismo tipo y moneda para unificarse.'),KashI18n.text('No se puede unificar'));return}if(isAutoExpenseRubro(src)||isAutoExpenseRubro(dst)){darkAlert(KashI18n.text('Los rubros automáticos de Gastos no se pueden unificar desde esta opción.'),KashI18n.text('No se puede unificar'));return}const srcEntries=Object.entries(D.C||{}).filter(([k])=>k.startsWith(src.id+'|'));const conflicts=[];for(const [k,c] of srcEntries){if(!cellMeaningful(c))continue;const month=k.split('|')[1],dc=D.C[dst.id+'|'+month];if(cellMeaningful(dc))conflicts.push(month)}if(conflicts.length){const labels=[...new Set(conflicts)].sort().map(m=>lb(m)).join(', ');darkAlert(KashI18n.template`No se hizo ningún cambio porque ambos rubros tienen datos en ${conflicts.length===1?KashI18n.text('el mes'):KashI18n.text('los meses')}: ${labels}. Revisá esos períodos y dejá los datos en uno solo antes de unificar.`,KashI18n.text('Conflicto al unificar'));return}darkConfirm(KashI18n.template`¿Unificar "${src.n}" con "${dst.n}"? El rubro "${src.n}" desaparecerá, pero su histórico se conservará dentro de "${dst.n}".`,()=>{for(const [k,c] of srcEntries){const month=k.split('|')[1],dk=dst.id+'|'+month;if(cellMeaningful(c)||!has(D.C,dk))D.C[dk]={...c};delete D.C[k]}const dates=[src.from,dst.from].filter(Boolean).sort();dst.from=dates[0]||src.from||dst.from||null;dst.on=!!(src.on||dst.on);if(dst.on)dst.to=null;else{const tos=[src.to,dst.to].filter(Boolean).sort();dst.to=tos[tos.length-1]||null}transferServiceDates(src.id,dst.id);D.rub=D.rub.filter(r=>r.id!==src.id);if(S.sel&&String(S.sel).startsWith(src.id+'|'))S.sel=String(S.sel).replace(/^\d+\|/,dst.id+'|');commit()},KashI18n.text('Confirmar unificación'))}
